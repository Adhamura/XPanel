name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  debian:
    name: Build (Debian 13, Qt 6.8) + AppImage + release archive
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git
      - uses: actions/checkout@v4
      - name: Install build dependencies (packaging/build-deps-debian.txt)
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $(cat packaging/build-deps-debian.txt)
      - name: Build AppImage and release archive
        run: ./build-release.sh --clean
      - name: Unit tests
        run: ctest --test-dir build-release --output-on-failure
      - name: Smoke test the AppImage (QML and Qt plugin errors)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb xauth sway libegl-mesa0 libgl1-mesa-dri
          packaging/appimage/smoke-test.sh dist/XPanel-*-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: xpanel-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Build (Windows x64, Qt 6.8) + installer [experimental]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: "6.8.3", arch: win64_msvc2022_64, cache: true }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tools (Ninja, Inno Setup)
        run: choco install ninja innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: packaging/windows/build-release.ps1 -Clean
      - name: Smoke test (offscreen)
        shell: pwsh
        run: packaging/windows/smoke-test.ps1 build-release-win/stage/XPanel.exe
      - uses: actions/upload-artifact@v4
        with: { name: xpanel-windows-x64, path: "dist/*", if-no-files-found: error }

  arch:
    name: Build (Arch Linux, latest Qt) + install rules
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-declarative qt6-svg qt6-tools layer-shell-qt
      - uses: actions/checkout@v4
      - name: Build (with developer tools)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DXPANEL_REQUIRE_TRANSLATIONS=ON
          cmake --build build
          build/bin/XPanel --version
          build/bin/xpanel-daemon --version
          grep -q '^XPANEL_LAYERSHELL_ACTIVE_SCREEN:INTERNAL=1$' build/CMakeCache.txt
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Install into a staging dir
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          test -x stage/usr/bin/XPanel
          test -f stage/usr/share/applications/xpanel.desktop
          grep -q '^ExecStart=/usr/bin/xpanel-daemon$' stage/usr/lib/systemd/system/xpanel-daemon.service
          test -f stage/usr/lib/sysusers.d/xpanel.conf
          ! find stage -name 'tst_*' | grep -q . # the unit tests are not installed

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning build-release.sh run.sh scripts/*.sh tools/mapper.sh tools/screenshots/capture.sh packaging/appimage/AppRun packaging/appimage/appimage-install.sh packaging/appimage/smoke-test.sh
